[project]
name = "mcptools"
version = "0.1.0"
description = "MCP utility servers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ansible-runner>=2.4.0",
    "mcp>=1.26.0",
    "openpyxl>=3.1.5",
    "paramiko>=4.0.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    "requests>=2.32.5",
]

[project.scripts]
ansible-mcp = "mcp_ansible.main:main"
